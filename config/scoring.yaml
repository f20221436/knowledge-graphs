# Credit-increase suitability score — DEMONSTRATIVE SCENARIO FRAMEWORK.
# This is NOT a banking underwriting policy. The dataset contains no credit-increase requests or outcomes;
# the requested increase is a hypothetical scenario parameter. Weights and breakpoints are transparent
# design choices, anchored where possible to the validated bucket tables of notebook 03.

disclaimer: >-
  Demonstrative scenario analysis only. The requested increase is hypothetical and the score is not an
  underwriting decision; the dataset contains no credit-increase outcomes.

# Absolute amounts are only examples. The score itself is relative: every request is measured against
# the customer's own historical scale (typical payment, current limit).
scenario_amounts: [10000, 20000, 30000, 50000]
default_increase: 30000
# Relative scenarios: request expressed in each customer's own units.
relative_scenarios:
  payment_multiple: [1, 3, 6, 12]     # request = k x typical (median) monthly payment
  limit_share: [0.10, 0.25, 0.50]     # request = p x current credit limit

# Each component maps one input to a sub-score in [0, 1] by linear interpolation between breakpoints.
# Score = 100 * sum(weight * sub_score). Weights must sum to 1.
components:
  model_risk:
    label: predicted default risk (calibrated)
    input: pd
    weight: 0.30
    x: [0.10, 0.60]
    y: [1.0, 0.0]
    anchor: calibrated PD already equals an expected default rate
  repayment:
    label: repayment record (late months, latest status)
    input: late_months
    weight: 0.20
    # sub-score = 1 - late_months/6, halved if the latest month is late
    anchor: notebook 03 H2 (11.5% default at 0 late months -> 70% at 6), H11 (recent lateness matters)
  coverage:
    label: payment coverage of previous statements
    input: coverage_median
    weight: 0.15
    x: [0.0, 0.10, 0.50, 0.99]
    y: [0.0, 0.40, 0.80, 1.0]
    anchor: notebook 03 H3 (58% default at 0 coverage, ~25% below 10%, ~15-17% at 50%+)
  payback:
    label: request vs typical demonstrated payment (payback months)
    input: payback_months
    weight: 0.20
    x: [1, 3, 10, 30]
    y: [1.0, 0.85, 0.5, 0.0]
    anchor: notebook 03 H10 default rate by payback band - <=1 month 4.6%, 1-3 8.9%, 3-10 15.8%, 10-30 23.8%, >30 28.6%
  request_vs_limit:
    label: request size vs current limit
    input: increase_to_limit
    weight: 0.10
    x: [0.25, 1.0, 2.0]
    y: [1.0, 0.3, 0.0]
    anchor: policy assumption (not derived from data) - large jumps relative to the limit are treated cautiously
  utilization:
    label: current utilization (U-shape aware)
    input: util_latest
    weight: 0.05
    x: [0.0, 0.10, 0.50, 0.90, 1.00]
    y: [0.9, 1.0, 1.0, 0.3, 0.2]
    inactive_value: 0.5
    anchor: notebook 02/03 H1 (U-shape; lowest default at 10-50% utilization)

gates:
  high_risk_pd: 0.50          # PD at or above this -> "Not supportable in this scenario"
  severe_latest_status: 2     # latest month 2+ months late -> "Not supportable in this scenario"

bands:
  supportable: 70             # score >= 70
  review: 50                  # 50 <= score < 70; below 50 -> not supportable
