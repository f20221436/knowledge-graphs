[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit_kg"
version = "0.2.0"
description = "Knowledge-graph-driven credit risk, credit-increase scenario score, and a guarded LLM explanation agent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
